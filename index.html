  },

  education: function () {

      return '<li><h3 class="font-semibold text-slate-900">' + esc(e.title) + (e.place ? ' – ' + esc(e.place) : '') + '</h3><p class="text-sm text-slate-500">' + esc(e.date) + '</p></li>';

  profession: function () {

        (e.link ? '<a href="' + esc(e.link) + '" target="_blank" rel="noopener" class="hover:underline">' + esc(e.org) + '</a>' : esc(e.org)) + '</p><p class="mt-1 text-slate-600">' + esc(e.text) + '</p></div>';
    }).join(''));

  physical: function () {

      DATA.physical.map(function (r) { return '<div class="flex justify-between gap-4 py-2.5"><dt class="text-slate-500">' + esc(r[0]) + '</dt><dd class="text-right font-semibold">' + esc(r[1]) + '</dd></div>'; }).join('') + '</dl>');
  },

  contact: function () {
    return Card('contact', 'যোগাযোগ', '<ul class="mt-4 grid gap-3 text-sm sm:grid-cols-2 sm:gap-x-10">' +
      DATA.contacts.map(function (c) { return '<li><a class="flex justify-between gap-3 hover:text-teal-800" href="' + esc(c[2]) + '" target="_blank" rel="noopener"><span class="text-slate-500">' + esc(c[0]) + '</span><span class="font-semibold">' + esc(c[1]) + '</span></a></li>'; }).join('') + '</ul>');
  },

  gallery: function () {
    return Card('gallery', 'ছবি', '<div class="mt-4 grid grid-cols-2 gap-3 sm:grid-cols-3">' + DATA.photos.map(function (p, i) {
      return '<button type="button" data-i="' + i + '" class="overflow-hidden rounded-xl border border-slate-200 text-left"><div class="aspect-[4/5] w-full">' +
        (p.src ? '<img src="' + esc(p.src) + '" alt="' + esc(p.alt) + '" loading="lazy" class="h-full w-full object-cover">' : Ph('ছবি যোগ করুন')) + '</div><p class="px-3 py-2 text-sm text-slate-700">' + esc(p.caption) + '</p></button>';
    }).join('') + '</div>');

/* =========================================================
   ৪) অ্যাপ লজিক
   ========================================================= */
function filled(v) {
  if (v == null || v === '') return false;
  if (Array.isArray(v)) return v.length > 0;
  if (typeof v === 'object') return Object.keys(v).length > 0;
  return true;
}
var HAS = {
  about:      function () { return filled(DATA.name); },
  personal:   function () { return filled(DATA.personal); },
  family:     function () { return filled(DATA.family); },
  education:  function () { return filled(DATA.education); },
  profession: function () { return filled(DATA.profession); },
  physical:   function () { return filled(DATA.physical); },
  contact:    function () { return filled(DATA.contacts); },
  gallery:    function () { return filled(DATA.photos); }
};
function isOn(s) { return s.show && COMPONENTS[s.id] && (!HAS[s.id] || HAS[s.id]()); }

(function () {
  var on = SECTIONS.filter(isOn);
  if (!on.length) return;
  document.getElementById('app').innerHTML = on.map(function (s) { return COMPONENTS[s.id](); }).join('');
  document.getElementById('yr').textContent = new Date().getFullYear();
  var tb = document.getElementById('topbar');
  tb.innerHTML = '<div class="mx-auto max-w-4xl px-4"><a href="#top" id="brand" class="flex w-fit items-center gap-2 pb-1 pt-2" aria-label="উপরে যান">' + Avatar('h-9 w-9 text-sm') +
    '<span class="text-sm font-semibold text-slate-900 sm:text-base">' + esc(DATA.name) + '</span></a><div id="tabs" class="flex overflow-x-auto" role="navigation" aria-label="সেকশন">' +
    on.map(function (s) { return '<a href="#s-' + s.id + '" class="tab" data-t="' + s.id + '">' + esc(s.tab) + '</a>'; }).join('') + '</div></div>';
  var bar = document.getElementById('tabs'), smooth = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  tb.addEventListener('click', function (e) {
    var a = e.target.closest('a'); if (!a) return; e.preventDefault();
    if (a.id === 'brand') { window.scrollTo({ top: 0, behavior: smooth ? 'smooth' : 'auto' }); return; }
    var el = document.getElementById(a.getAttribute('href').slice(1));
    if (el) el.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' });
  });
  var current = '', ticking = false;
  function spy() {
    ticking = false;
    var first = document.getElementById('s-' + on[0].id);
    tb.classList.toggle('hidden', !(first && first.getBoundingClientRect().bottom < 56));
    var cur = on[0].id;
    on.forEach(function (s) { var el = document.getElementById('s-' + s.id); if (el && el.getBoundingClientRect().top <= 130) cur = s.id; });
    if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) cur = on[on.length - 1].id;
    if (cur === current) return; current = cur;
    bar.querySelectorAll('.tab').forEach(function (a) {
      if (a.dataset.t === cur) { a.setAttribute('aria-current', 'true'); bar.scrollTo({ left: a.offsetLeft - bar.clientWidth / 2 + a.offsetWidth / 2, behavior: smooth ? 'smooth' : 'auto' }); }
      else a.removeAttribute('aria-current');
    });
  }
  window.addEventListener('scroll', function () { if (!ticking) { ticking = true; requestAnimationFrame(spy); } }, { passive: true });
  window.addEventListener('resize', spy); spy();

  var lb = document.getElementById('lb');
  document.getElementById('app').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-i]'); if (!b) return;
    var p = DATA.photos[+b.dataset.i]; if (!p || !p.src) return;
    document.getElementById('lbimg').src = p.src; document.getElementById('lbimg').alt = p.alt;
    document.getElementById('lbcap').textContent = p.caption; lb.showModal();
  });
  document.getElementById('lbx').onclick = function () { lb.close(); };
  lb.addEventListener('click', function (e) { if (e.target === lb) lb.close(); });
})();

/* =========================================================
   ৫) PDF Generation (Smart Slicing & Full Page Images)
   ========================================================= */
(function () {
  function rowHtml(r) {
    return '<div class="pdf-row"><span class="pdf-label">' + esc(r[0]) + '</span><span class="pdf-value">' + esc(r[1]) + '</span></div>';
  }

  function buildPdfContent() {
    document.getElementById('pdf-personal').innerHTML = DATA.personal.map(rowHtml).join('');
    document.getElementById('pdf-family').innerHTML   = DATA.family.map(rowHtml).join('');
    document.getElementById('pdf-physical').innerHTML = DATA.physical.map(rowHtml).join('');

    document.getElementById('pdf-education').innerHTML = DATA.education.map(function (e) {
      return '<div class="pdf-edu"><div class="pdf-edu-t">' + esc(e.title) + '</div>' +
             '<div class="pdf-edu-s">' + esc(e.place) + ' &nbsp;•&nbsp; ' + esc(e.date) + '</div></div>';
    }).join('');

    document.getElementById('pdf-profession').innerHTML = DATA.profession.map(function (e) {
      return '<div class="pdf-edu"><div class="pdf-edu-t">' + esc(e.title) + '</div>' +
             '<div class="pdf-edu-s" style="color:#0f766e;font-weight:600;">' + esc(e.org) + '</div>' +
             '<div class="pdf-edu-s" style="margin-top:2px;">' + esc(e.text) + '</div></div>';
    }).join('');

    // 📌 PDF গ্যালারি স্পেসিফিক লজিক (১, ২, ৩ বা ৪টি ছবি)
    var galleryEl = document.getElementById('pdf-gallery');
    if (galleryEl) {
      galleryEl.className = 'pdf-gallery-grid';
      var numPhotos = DATA.photos ? DATA.photos.length : 0;
      
      if (numPhotos === 1) galleryEl.classList.add('grid-1');
      else if (numPhotos === 2) galleryEl.classList.add('grid-2');
      else if (numPhotos === 3) galleryEl.classList.add('grid-3');
      else if (numPhotos >= 4) galleryEl.classList.add('grid-4');

      if (numPhotos > 0) {
        galleryEl.innerHTML = DATA.photos.map(function(p) {
          return '<div class="pdf-gallery-item">' +
                 (p.src ? '<img src="' + esc(p.src) + '" alt="' + esc(p.alt) + '" crossorigin="anonymous">' : '<div style="height:150px; display:flex; align-items:center; justify-content:center; background:#f1f5f9; color:#64748b;">ছবি নেই</div>') +
                 '</div>';
        }).join('');
      } else {
        galleryEl.innerHTML = '<div style="font-size:12px; color:#64748b;">কোনো ছবি যুক্ত করা হয়নি।</div>';
      }
    }

    var photoEl = document.getElementById('pdf-photo');
    if (DATA.photo) {
      photoEl.innerHTML = '<img src="' + esc(DATA.photo) + '" alt="" crossorigin="anonymous" ' +
        'style="width:100%;height:100%;object-fit:cover;" ' +
        'onerror="this.parentNode.innerHTML=\'মম\'">';
    }
  }

  async function ensureFonts() {
    try {
      if (!document.fonts) return;
      await Promise.all([
        document.fonts.load('600 16px "Hind Siliguri"'),
        document.fonts.load('400 16px "Hind Siliguri"'),
        document.fonts.load('700 16px "Noto Serif Bengali"')
      ]);
      await document.fonts.ready;
    } catch (e) { /* ignore */ }
  }

  function waitImages(root) {
    var imgs = Array.prototype.slice.call(root.querySelectorAll('img'));
    return Promise.all(imgs.map(function (img) {
      if (img.complete) return Promise.resolve();
      return new Promise(function (res) { img.onload = img.onerror = res; });
    }));
  }

  function downloadBlob(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.rel = 'noopener';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
  }

  async function makePdf() {
    var el = document.getElementById('pdf-template');
    var SCALE = 3;

    await ensureFonts();
    buildPdfContent();
    await waitImages(el);

    // 💡 সঠিক পজিশন ক্যালকুলেশন (যাতে ছবি বা সেকশন মাঝখান থেকে না কাটে)
    var elRect = el.getBoundingClientRect();
    var sections = Array.from(el.querySelectorAll('.pdf-sec, .pdf-gallery-item'));
    var boundsToAvoid = sections.map(function(node) {
        var rect = node.getBoundingClientRect();
        return { 
            top: (rect.top - elRect.top) * SCALE, 
            bottom: (rect.bottom - elRect.top) * SCALE 
        };
    });

    var canvas = await html2canvas(el, {
      scale: SCALE,
      useCORS: true,
      allowTaint: false,
      backgroundColor: '#ffffff',
      logging: false,
      width: el.offsetWidth,
      height: el.offsetHeight,
      windowWidth: el.offsetWidth,
      windowHeight: el.offsetHeight
    });

    var jsPDFCtor = (window.jspdf && window.jspdf.jsPDF) ? window.jspdf.jsPDF : window.jsPDF;
    var pdf = new jsPDFCtor({ unit: 'mm', format: 'a4', orientation: 'portrait', compress: true });
    pdf.setProperties({ title: 'মির্জা মোজাহিদ – সিভি', author: 'মির্জা মোজাহিদ' });

    var PAGE_W = 210, PAGE_H = 297; 
    var CONTENT_W = PAGE_W; 
    var CONTENT_H = PAGE_H; 

    var pxPerMm = canvas.width / CONTENT_W;
    var sliceHeightPx = Math.floor(CONTENT_H * pxPerMm);

    var y = 0, pageIndex = 0;
    
    while (y < canvas.height) {
      var idealCutY = y + sliceHeightPx;
      var actualCutY = idealCutY;

      if (idealCutY < canvas.height) {
          for (var i = 0; i < boundsToAvoid.length; i++) {
              var b = boundsToAvoid[i];
              if (b.top < idealCutY && b.bottom > idealCutY) {
                  if (b.top > y + 20) {
                      actualCutY = Math.min(actualCutY, b.top);
                  }
              }
          }
      }

      var h = actualCutY - y; 
      
      // 💡 ফাঁকা পেজ আটকানোর লজিক: যদি বাকি অংশ ১০ পিক্সেলের কম হয়, তবে নতুন পেজ তৈরি হবে না
      if (h <= 10) break; 

      var slice = document.createElement('canvas');
      slice.width = canvas.width;
      slice.height = h;
      var ctx = slice.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, slice.width, slice.height);
      ctx.drawImage(canvas, 0, y, canvas.width, h, 0, 0, canvas.width, h);

      var imgData = slice.toDataURL('image/jpeg', 0.94);

      if (pageIndex > 0) pdf.addPage();
      pdf.addImage(imgData, 'JPEG', 0, 0, CONTENT_W, h / pxPerMm, undefined, 'FAST');

      y = actualCutY; 
      pageIndex++;
    }

    return pdf.output('blob');
  }

  var btn = document.getElementById('pdfbtn');
  if (btn) {
    btn.addEventListener('click', async function () {
      if (btn.disabled) return;
      var label = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'PDF তৈরি হচ্ছে...';
      try {
        var blob = await makePdf();
        downloadBlob(blob, 'Mirza-Mojahid-Marriage-CV.pdf');
      } catch (err) {
        console.error(err);
        alert('PDF তৈরি করতে সমস্যা হয়েছে। ইন্টারনেট সংযোগ পরীক্ষা করে আবার চেষ্টা করুন।');
      } finally {
        btn.disabled = false;
        btn.textContent = label;
      }
    });
  }
})();
</script>
